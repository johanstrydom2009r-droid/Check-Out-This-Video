<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Here</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #container {
            text-align: center;
        }
        button {
            padding: 20px 40px;
            font-size: 24px;
            background-color: #ff0055;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div id="container">
        <h1>Wait for it...</h1>
        <button id="btn" onclick="startVirus()">TAP TO START</button>
    </div>

    <script>
        function startVirus() {
            // 1. Play Sound (Looping)
            var audio = new Audio('https://www.soundjay.com/human/sounds/woman-moan-01.mp3');
            audio.loop = true;
            audio.volume = 1.0; // Max Volume
            audio.play();

            // 2. Change UI to be annoying
            document.getElementById('container').innerHTML = "<h1>OOPS!</h1>";
            
            // 3. Try Fullscreen
            try {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) { /* Safari */
                    document.documentElement.webkitRequestFullscreen();
                } else if (document.documentElement.msRequestFullscreen) { /* IE11 */
                    document.documentElement.msRequestFullscreen();
                }
            } catch(e) {}

            // 4. Prevent easy exit by asking confirmation on close
            window.onbeforeunload = function() {
                return "Are you sure?";
            };
        }
    </script>
</body>
</html>
